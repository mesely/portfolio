<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Proje Detayı</title>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [["\\(", "\\)"]],
        displayMath: [["\\[", "\\]"]]
      },
      svg: { fontCache: "global" }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root{
      --g1:#667eea;
      --g2:#764ba2;
      --g3:#f093fb;

      --text:#1a1a1a;
      --muted:#666;
      --bg:#ffffff;
      --bg-soft:#f8f9fa;
      --border:#e9ecef;

      --radius: 20px;
      --radius-sm: 12px;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      --shadow-2: 0 8px 25px rgba(0, 0, 0, 0.10);
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      min-height: 100vh;
      color: var(--text);
      overflow-x: hidden;
    }

    /* Navigation */
    nav {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem 5%;
      background: rgba(248, 249, 250, 0.85);
      backdrop-filter: blur(10px);
      border-bottom: 2px solid var(--border);
      gap: 1rem;
    }

    .nav-left{
      display: flex;
      align-items: center;
      gap: 1rem;
      min-width: 0;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.8rem 1.5rem;
      background: linear-gradient(135deg, var(--g1), var(--g2));
      border: none;
      border-radius: 10px;
      color: #fff;
      text-decoration: none;
      transition: all 0.3s;
      font-weight: 800;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.22);
      white-space: nowrap;
    }
    .back-btn:hover {
      transform: translateX(-5px);
      box-shadow: 0 6px 22px rgba(102, 126, 234, 0.30);
    }

    .crumb{
      color: var(--muted);
      font-weight: 800;
      font-size: 0.95rem;
      display: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 52vw;
    }
    @media (min-width: 900px){
      .crumb{ display: block; }
    }

    .nav-actions{
      display: flex;
      gap: 0.75rem;
      align-items: center;
      justify-content: flex-end;
      flex-shrink: 0;
    }

    /* ===== Language Switch (Top Right inside nav) ===== */
    .lang-switch{
      display: inline-flex;
      gap: .45rem;
      padding: .35rem;
      border-radius: 999px;
      background: rgba(255,255,255,.75);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(0,0,0,.06);
      box-shadow: 0 10px 22px rgba(0,0,0,.08);
    }
    .lang-btn{
      border: none;
      cursor: pointer;
      padding: .55rem .9rem;
      border-radius: 999px;
      font-weight: 900;
      font-size: .9rem;
      color: var(--muted);
      background: transparent;
      transition: all .2s ease;
      white-space: nowrap;
    }
    .lang-btn:hover{
      background: rgba(102,126,234,.10);
      color: var(--g2);
    }
    .lang-btn.active{
      background: linear-gradient(135deg, var(--g1), var(--g2));
      color: #fff;
      box-shadow: 0 10px 18px rgba(102,126,234,.18);
    }

    /* Project Header */
    .project-header {
      text-align: center;
      padding: 4rem 5% 2rem;
      background: var(--bg);
      position: relative;
      overflow: hidden;
    }

    .project-header::before{
      content:"";
      position:absolute;
      width: 900px;
      height: 900px;
      left: 50%;
      top: 20%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle at center,
        rgba(102,126,234,.18),
        rgba(118,75,162,.12),
        rgba(240,147,251,.06),
        transparent 70%);
      filter: blur(10px);
      pointer-events:none;
    }

    .project-header h1 {
      font-size: 3rem;
      margin-bottom: 0.75rem;
      background: linear-gradient(135deg, var(--g1), var(--g2), var(--g3));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      position: relative;
      z-index: 1;
    }

    .meta-row{
      display:flex;
      gap: 0.75rem;
      justify-content:center;
      align-items:center;
      flex-wrap: wrap;
      margin-bottom: 1rem;
      position: relative;
      z-index: 1;
    }

    .company-badge {
      display: inline-block;
      background: linear-gradient(135deg, var(--g1), var(--g2));
      color: #fff;
      padding: 0.6rem 1.4rem;
      border-radius: 999px;
      font-size: 1.05rem;
      font-weight: 950;
      box-shadow: 0 8px 18px rgba(0,0,0,.10);
    }

    .meta-chip{
      display:inline-flex;
      align-items:center;
      gap: .5rem;
      padding: 0.55rem 1rem;
      border-radius: 999px;
      border: 1px solid rgba(0,0,0,.06);
      background: rgba(255,255,255,.70);
      color: var(--muted);
      font-weight: 850;
      box-shadow: 0 8px 18px rgba(0,0,0,.06);
    }

    .description {
      font-size: 1.15rem;
      color: var(--muted);
      max-width: 900px;
      margin: 0 auto;
      line-height: 1.75;
      position: relative;
      z-index: 1;
    }

    /* Tech Stack */
    .tech-stack {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.8rem;
      padding: 1.6rem 5%;
      background: var(--bg-soft);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    .tech-tag {
      background: linear-gradient(135deg, var(--g1), var(--g2));
      color: #fff;
      padding: 0.6rem 1.2rem;
      border-radius: 999px;
      font-weight: 950;
      font-size: 0.92rem;
      box-shadow: 0 10px 18px rgba(102,126,234,.18);
    }

    /* Content Layout */
    .project-content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2.25rem 5% 4.5rem;
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.4rem;
    }

    /* Daha dengeli: 1fr / 1fr */
    .cards-row{
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.4rem;
      align-items: stretch;
    }

    @media (max-width: 980px){
      .cards-row{ grid-template-columns: 1fr; }
    }

    .card {
      background: #fff;
      border-radius: var(--radius);
      padding: 2.1rem;
      border: 2px solid var(--border);
      box-shadow: var(--shadow);
      animation: fadeInUp .6s ease-out;
      height: 100%;
    }

    /* ÖZET kartını daha "ortada" hissettirmek için */
    .card.overview-card{
      display:flex;
      flex-direction:column;
      justify-content:center;   /* dikeyde ortalar */
      text-align:left;          /* okunabilirlik için solda */
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(26px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card h2{
      font-size: 1.55rem;
      margin-bottom: .7rem;
      color: var(--g2);
      letter-spacing: .2px;
    }

    .card .sublead{
      color: var(--muted);
      font-weight: 800;
      line-height: 1.6;
      margin-bottom: 1rem;
      font-size: 1.02rem;
    }

    .card p{
      font-size: 1.08rem;
      line-height: 1.85;
      color: #444;
    }

    .bullets{
      margin-top: .75rem;
      display: grid;
      gap: .65rem;
    }

    .bullet{
      display:flex;
      gap: .8rem;
      align-items:flex-start;
      padding: .9rem 1rem;
      border-radius: 14px;
      background: rgba(102,126,234,.06);
      border: 1px solid rgba(102,126,234,.18);
    }

    .bullet .dot{
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--g1), var(--g2));
      margin-top: .38rem;
      flex-shrink: 0;
      box-shadow: 0 6px 14px rgba(102,126,234,.25);
    }

    .bullet div{
      color:#333;
      line-height: 1.7;
      font-size: 1.02rem;
      font-weight: 700;
    }

    .kpi-grid{
      display:grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: .9rem;
      margin-top: .95rem;
    }

    .kpi{
      padding: 1rem 1rem;
      border-radius: 16px;
      border: 1px solid rgba(0,0,0,.06);
      background: #fff;
      box-shadow: 0 10px 18px rgba(0,0,0,.06);
    }
    .kpi .label{
      color: var(--muted);
      font-weight: 950;
      font-size: .9rem;
      margin-bottom: .25rem;
    }
    .kpi .value{
      font-weight: 950;
      font-size: 1.15rem;
      background: linear-gradient(135deg, var(--g1), var(--g2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    @media (max-width: 520px){
      .kpi-grid{ grid-template-columns: 1fr; }
    }

    /* Research / math sections */
    .detail-section{
      background:
        linear-gradient(135deg, rgba(102,126,234,.08), rgba(240,147,251,.08)),
        #fff;
      border-radius: var(--radius);
      padding: 2.25rem;
      border: 2px solid var(--border);
      box-shadow: var(--shadow);
      animation: fadeInUp 0.6s ease-out;
      position: relative;
      overflow: hidden;
    }

    .detail-section::before{
      content: "";
      position: absolute;
      width: 240px;
      height: 240px;
      border-radius: 999px;
      right: -90px;
      top: -120px;
      background: radial-gradient(circle, rgba(102,126,234,.18), transparent 70%);
      pointer-events: none;
    }

    .detail-section h2{
      color: var(--g2);
      font-size: 1.55rem;
      margin-bottom: .65rem;
      position: relative;
    }

    .detail-lead{
      font-weight: 850;
      line-height: 1.75;
      color: #333;
      margin-bottom: 1.1rem;
      position: relative;
    }

    .detail-copy{
      display: grid;
      gap: .85rem;
      position: relative;
    }

    .detail-copy p{
      line-height: 1.85;
      color: #444;
      font-size: 1.04rem;
    }

    .detail-bullets{
      display: grid;
      gap: .7rem;
      margin-top: .35rem;
      position: relative;
    }

    .formula-grid{
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: .9rem;
      margin-top: 1.25rem;
      position: relative;
    }

    .formula-card{
      background: rgba(255,255,255,.9);
      border: 1px solid rgba(0,0,0,.08);
      border-radius: 18px;
      padding: 1rem;
      box-shadow: 0 12px 24px rgba(0,0,0,.06);
      overflow-x: auto;
    }

    .formula-label{
      color: var(--muted);
      font-size: .86rem;
      font-weight: 950;
      margin-bottom: .45rem;
      letter-spacing: .01em;
      text-transform: uppercase;
    }

    .formula-tex{
      min-width: max-content;
      color: #1f2430;
      font-size: 1.02rem;
      line-height: 1.6;
      padding: .25rem 0;
    }

    .table-wrap{
      margin-top: 1.25rem;
      overflow-x: auto;
      border-radius: 18px;
      border: 1px solid rgba(0,0,0,.08);
      box-shadow: 0 12px 24px rgba(0,0,0,.06);
      position: relative;
    }

    .detail-table{
      width: 100%;
      border-collapse: collapse;
      min-width: 720px;
      background: #fff;
    }

    .detail-table th,
    .detail-table td{
      padding: .9rem 1rem;
      text-align: left;
      border-bottom: 1px solid rgba(0,0,0,.07);
      vertical-align: top;
      line-height: 1.55;
    }

    .detail-table th{
      background: linear-gradient(135deg, rgba(102,126,234,.12), rgba(118,75,162,.12));
      color: var(--g2);
      font-weight: 950;
      white-space: nowrap;
    }

    .detail-table tr:last-child td{
      border-bottom: 0;
    }

    .detail-table td:first-child{
      font-weight: 900;
      color: #252531;
    }

    @media (max-width: 800px){
      .detail-section{ padding: 1.45rem; }
      .formula-grid{ grid-template-columns: 1fr; }
      .formula-tex{ font-size: .95rem; }
    }

    /* Image sections */
    .image-section {
      background: #ffffff;
      border-radius: var(--radius);
      padding: 2.2rem;
      border: 2px solid var(--border);
      box-shadow: var(--shadow);
      animation: fadeInUp 0.6s ease-out;
    }

    .image-section:nth-child(2) { animation-delay: 0.12s; }
    .image-section:nth-child(3) { animation-delay: 0.24s; }
    .image-section:nth-child(4) { animation-delay: 0.36s; }

    /* Görsel crop yok: contain + oran korunur */
    .project-image {
      width: 100%;
      height: auto;
      border-radius: 16px;
      margin-bottom: 1.2rem;
      box-shadow: var(--shadow-2);
      object-fit: contain;
      max-height: 85vh;
      background: #fff;
      cursor: zoom-in;
      display: block;
    }

    .image-placeholder {
      width: 100%;
      min-height: 420px;
      background: linear-gradient(135deg, var(--g1) 0%, var(--g2) 50%, var(--g3) 100%);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      gap: .4rem;
      align-items: center;
      justify-content: center;
      font-size: 4.6rem;
      margin-bottom: 1.2rem;
      box-shadow: var(--shadow-2);
      color: #fff;
      text-align:center;
      padding: 1rem;
    }

    .placeholder-sub{
      font-size: 1rem;
      opacity: .95;
      font-weight: 950;
      letter-spacing: .2px;
    }

    .image-section h3 {
      font-size: 1.35rem;
      margin-bottom: 0.6rem;
      color: var(--g2);
    }

    .image-section p {
      font-size: 1.06rem;
      line-height: 1.85;
      color: #444;
    }

    /* Lightbox */
    .lightbox{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 1.2rem;
    }
    .lightbox.active{ display:flex; }

    .lightbox-inner{
      max-width: 1100px;
      width: 100%;
      position: relative;
      animation: fadeInUp .25s ease-out;
    }

    .lightbox-img{
      width: 100%;
      border-radius: 18px;
      box-shadow: 0 18px 50px rgba(0,0,0,.35);
      max-height: 85vh;
      object-fit: contain;
      background: #111;
    }

    .lightbox-close{
      position:absolute;
      top: -14px;
      right: -14px;
      width: 44px;
      height: 44px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      font-weight: 900;
      color: #fff;
      background: linear-gradient(135deg, var(--g1), var(--g2));
      box-shadow: 0 10px 20px rgba(0,0,0,.25);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .project-header h1 { font-size: 2rem; }
      .image-section, .card { padding: 1.4rem; }
      nav { padding: 1.05rem 5%; }
      .project-image { max-height: 65vh; }
      .image-placeholder { min-height: 300px; font-size: 3.8rem; }
    }
  </style>
</head>

<body>
  <nav>
    <div class="nav-left">
      <a href="index.html" class="back-btn" id="backBtn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        <span id="backBtnText">Geri Dön</span>
      </a>
      <div class="crumb" id="crumb">
        <span id="crumbPrefix">Projeler / </span><span style="color:#1a1a1a" id="crumbTitle">—</span>
      </div>
    </div>

    <div class="nav-actions">
      <div class="lang-switch" role="group" aria-label="Language switch">
        <button class="lang-btn" id="btnTR" type="button">TR</button>
        <button class="lang-btn" id="btnEN" type="button">EN</button>
      </div>
    </div>
  </nav>

  <div class="project-header">
    <h1 id="project-title"></h1>

    <div class="meta-row">
      <div class="company-badge" id="company"></div>
      <div class="meta-chip" id="periodChip">📅 —</div>
      <div class="meta-chip" id="locChip">📍 —</div>
    </div>

    <p class="description" id="description"></p>
  </div>

  <div class="tech-stack" id="tech-stack"></div>

  <div class="project-content" id="project-content"></div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" aria-hidden="true">
    <div class="lightbox-inner">
      <button class="lightbox-close" id="lightboxClose" aria-label="Kapat">✕</button>
      <img class="lightbox-img" id="lightboxImg" alt="Proje görseli" />
    </div>
  </div>

  <script>
    // ===== Dil (index ile aynı key) =====
    const btnTR = document.getElementById("btnTR");
    const btnEN = document.getElementById("btnEN");

    function getLang(){
      const saved = localStorage.getItem("lang");
      return (saved === "en" || saved === "tr") ? saved : "tr";
    }
    function setLang(lang){
      localStorage.setItem("lang", lang);
      applyLang(lang);
      render(); // içerikler dil değiştirsin
    }

    const UI_TEXT = {
      tr: {
        back: "Geri Dön",
        crumbPrefix: "Projeler / ",
        notFoundTitle: "Proje bulunamadı",
        notFoundDesc: "Proje bilgisi bulunamadı. Lütfen ana sayfadan bir projeyi tekrar aç.",
        goHome: "Ana Sayfaya Dön",
        overviewTitle: "Özet",
        overviewSub: "Bu projenin amacı ve genel yaklaşımı.",
        highlightsTitle: "Öne Çıkanlar",
        highlightsSub: "Projede doğrudan üstlendiğim katkılar ve çıktılar.",
        imgMissing: "Görsel bulunamadı",
        close: "Kapat",
        pageTitleSuffix: "— Proje Detayı",
      },
      en: {
        back: "Back",
        crumbPrefix: "Projects / ",
        notFoundTitle: "Project not found",
        notFoundDesc: "Project details could not be loaded. Please open a project again from the home page.",
        goHome: "Go to Home",
        overviewTitle: "Summary",
        overviewSub: "Goal, scope, and overall approach of the project.",
        highlightsTitle: "Highlights",
        highlightsSub: "Direct contributions, responsibilities, and concrete outputs.",
        imgMissing: "Image not found",
        close: "Close",
        pageTitleSuffix: "— Project Details",
      }
    };

    function applyLang(lang){
      document.documentElement.lang = lang;
      btnTR.classList.toggle("active", lang === "tr");
      btnEN.classList.toggle("active", lang === "en");

      document.getElementById("backBtnText").textContent = UI_TEXT[lang].back;
      document.getElementById("crumbPrefix").textContent = UI_TEXT[lang].crumbPrefix;

      document.getElementById("lightboxClose").setAttribute("aria-label", UI_TEXT[lang].close);
      document.getElementById("lightboxImg").alt = (lang === "tr" ? "Proje görseli" : "Project image");
    }

    btnTR.addEventListener("click", () => setLang("tr"));
    btnEN.addEventListener("click", () => setLang("en"));

    // ============ PROJE VERİLERİ ============
    // Görseller: images/<prefix><n>.png
    const PROJECTS = {
      chefinpocket: {
        id: "chefinpocket",
        icon: "🍳",
        title: { tr: "ChefInPocket", en: "ChefInPocket" },
        company: {
          tr: "Sabancı Üniversitesi · CS310 Takım Projesi",
          en: "Sabancı University · CS310 Team Project"
        },
        period: "Spring 2026",
        location: "İstanbul, Türkiye",
        description: {
          tr: "Flutter ile geliştirilen çok ekranlı mobil/web deneyimini, Node.js tabanlı 6 mikroservis, MongoDB veri katmanı ve API gateway ile birleştiren akıllı tarif ve yemek planlama ürünü geliştirdik. Chef AI, malzeme özelleştirme, alışveriş listesi ve adım adım pişirme akışlarını tek bir ürün yolculuğunda topladık.",
          en: "Built a smart recipe and meal-planning product that combines a multi-screen Flutter mobile/web experience with six Node.js microservices, a MongoDB-backed data layer, and an API gateway. The product brings Chef AI, ingredient customization, grocery planning, and step-by-step cooking into a single user journey."
        },
        tech: [
          "Flutter",
          "Node.js",
          "Express",
          "MongoDB",
          "Microservices",
          "Docker",
          "Nginx"
        ],
        overview: {
          title: { tr: "Özet", en: "Summary" },
          text: {
            tr: "ChefInPocket, kullanıcının tarif arama anından pişirme sürecinin son adımına kadar eşlik eden uçtan uca bir yemek asistanı olarak tasarlandı. Projede tarif keşfi, hızlı erişim kısayolları, Chef AI destekli soru-cevap, kişiselleştirilebilir malzeme değişimleri, alışveriş listesi ve rehberli pişirme akışlarını aynı ürün mimarisi içinde bir araya getirdik.",
            en: "ChefInPocket was designed as an end-to-end cooking companion that supports the user from recipe discovery to the final cooking step. The product brings together recipe search, quick-access shortcuts, Chef AI Q&A, customizable ingredient swaps, grocery planning, and guided cooking inside one cohesive product architecture."
          }
        },
        responsibilities: {
          tr: [
            "Flutter tabanlı kullanıcı yolculuğunu tarif keşfi, Chef AI, malzeme özelleştirme, grocery list ve guided cooking ekranları arasında tutarlı bir akışa dönüştürdüm.",
            "Auth, recipe, pantry, community, assistant ve content servislerini API gateway üzerinden çalışan modüler backend yapısında bir araya getirdim.",
            "Root-level Dockerfile ve Nginx kurulumu ile Flutter web build’ini ve backend servislerini Hugging Face Docker Space üzerinde çalışabilecek şekilde paketledim."
          ],
          en: [

        images: [

      },

      sneakpeek: {
        id: "sneakpeek",
        icon: "🛍️",
        title: { tr: "SneakPeek – E-ticaret Projesi", en: "SneakPeek — E-commerce Project" },
        company: { tr: "Kişisel Proje", en: "Personal Project" },
        period: "Mar 2025 – Haz 2025",
        location: "İstanbul, Türkiye",
        description: {
          tr: "NestJS + Next.js ile mikroservis mimarisinde e-ticaret geliştirdim. OpenAI GPT API ile ayakkabı önerici entegre ettim; JWT auth, Kafka messaging ve Docker ile konteynerleştirilmiş dağıtım uyguladım.",
          en: "Built a microservices e-commerce app with NestJS + Next.js. Integrated a GPT-based shoe recommender, JWT auth, Kafka messaging, and Dockerized deployment."
        },
        tech: ["NestJS", "Next.js", "Microservices", "OpenAI GPT", "JWT", "Kafka", "Docker"],
        overview: {
          title: { tr: "Özet", en: "Summary" },
          text: {
            tr: "Amaç; modern bir e-ticaret deneyimini ölçeklenebilir bir altyapıyla kurmak ve kullanıcıya AI destekli ürün keşfi sunmaktı. Servisler arası iletişim, güvenli kimlik doğrulama ve dağıtım süreçleri üretim mantığıyla kurgulandı.",
            en: "Goal was to build a scalable e-commerce experience and add AI-assisted product discovery. Inter-service communication, secure auth, and deployment were designed with production practices in mind."
          }
        },
        responsibilities: {
          tr: [
            "NestJS + Next.js ile mikroservis yaklaşımında e-ticaret altyapısını geliştirdim.",
            "GPT önerici, JWT auth, Kafka mesajlaşma ve Docker dağıtım süreçlerini entegre ettim."
          ],
          en: [
            "Implemented the microservices-based e-commerce infrastructure with NestJS + Next.js.",
            "Integrated GPT recommender, JWT auth, Kafka messaging, and Docker-based deployment."
          ]
        },
        kpis: [
          { label: { tr: "Mimari", en: "Architecture" }, value: "Microservices" },
          { label: { tr: "AI", en: "AI" }, value: "GPT-based Recommender" }
        ],
        images: [
          {
            title: { tr: "Sistem & AI Önerici", en: "System & AI Recommender" },
            desc: {
              tr: "Ürün keşfini iyileştirmek için GPT tabanlı öneri katmanı entegre ettim. İstek akışında JWT ile auth, servisler arası Kafka iletişimi ve Docker ile dağıtımı birlikte kurguladım.",
              en: "Integrated a GPT-based recommendation layer to improve product discovery. Combined JWT auth, Kafka-based service communication, and Docker deployment into a cohesive request flow."
            }
          }
        ]
      }
    };

    // ============ GERİ UYUMLULUK / ÖNCELİK ============
    function resolveProject(){
      const id = localStorage.getItem("currentProjectId");
      if(id && PROJECTS[id]) return PROJECTS[id];

      const raw = localStorage.getItem("currentProject");
      if(raw){
        try{
          const obj = JSON.parse(raw);
          if(obj && obj.title && obj.company){
            return normalizeLegacy(obj);
          }
        }catch(e){}
      }
      return null;
    }

    function normalizeLegacy(legacy){
      const id = legacy.imagePrefix || "project";
      const iconMap = {
        chefinpocket:"🍳", beme:"🧬", polieco:"🏛️", baykar:"🎯", bmc:"💬", intertech:"💰", arastirma:"🗣️",
        influencer:"📊", echospace:"🥽", bluesky:"🦋", music:"🎵", tbmm:"🕸️", sneakpeek:"🛍️"
      };

      return {
        id,
        icon: iconMap[id] || "✨",
        title: { tr: legacy.title || "Proje", en: legacy.title || "Project" },
        company: { tr: legacy.company || "—", en: legacy.company || "—" },
        period: legacy.period || "—",
        location: legacy.location || "—",
        description: { tr: legacy.description || "", en: legacy.description || "" },
        tech: legacy.tech || [],
        overview: {
          title: { tr: "Özet", en: "Summary" },
          text: { tr: legacy.description || "", en: legacy.description || "" }
        },
        responsibilities: {
          tr: legacy.responsibilities || [],
          en: legacy.responsibilities || []
        },
        kpis: (legacy.kpis || []).map(k => ({
          label: { tr: k.label, en: k.label },
          value: k.value
        })),
        images: (legacy.images || []).map(x => ({
          title: { tr: x.title, en: x.title },
          desc: { tr: x.desc, en: x.desc }
        }))
      };
    }

    // ============ UI ============
    const project = resolveProject();

    const titleEl = document.getElementById("project-title");
    const companyEl = document.getElementById("company");
    const descEl = document.getElementById("description");
    const techEl = document.getElementById("tech-stack");
    const contentEl = document.getElementById("project-content");

    const crumbTitle = document.getElementById("crumbTitle");
    const periodChip = document.getElementById("periodChip");
    const locChip = document.getElementById("locChip");

    // Lightbox
    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightboxImg");
    const lightboxClose = document.getElementById("lightboxClose");

    function openLightbox(src, alt){
      lightboxImg.src = src;
      lightboxImg.alt = alt || (getLang()==="tr" ? "Proje görseli" : "Project image");
      lightbox.classList.add("active");
      lightbox.setAttribute("aria-hidden","false");
    }
    function closeLightbox(){
      lightbox.classList.remove("active");
      lightbox.setAttribute("aria-hidden","true");
      lightboxImg.src = "";
    }
    lightbox.addEventListener("click", (e) => {
      if(e.target === lightbox) closeLightbox();
    });
    lightboxClose.addEventListener("click", closeLightbox);
    document.addEventListener("keydown", (e) => {
      if(e.key === "Escape") closeLightbox();
    });

    function escapeHtml(str){
      return String(str ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function pick(obj){
      const lang = getLang();
      if(obj && typeof obj === "object" && (obj.tr || obj.en)){
        return obj[lang] || obj.tr || obj.en || "";
      }
      return obj ?? "";
    }

    function imagePath(prefix, idx){
      return `images/${prefix}${idx}.png`;
    }

    function createTechTag(t){
      const div = document.createElement("div");
      div.className = "tech-tag";
      div.textContent = t;
      return div;
    }

    function createBullet(text){
      const row = document.createElement("div");
      row.className = "bullet";
      row.innerHTML = `<div class="dot"></div><div>${escapeHtml(text)}</div>`;
      return row;
    }

    function createKpi(label, value){
      const box = document.createElement("div");
      box.className = "kpi";
      box.innerHTML = `<div class="label">${escapeHtml(label)}</div><div class="value">${escapeHtml(value)}</div>`;
      return box;
    }

    function pickArray(obj){
      const picked = pick(obj);
      if(Array.isArray(picked)) return picked;
      return picked ? [picked] : [];
    }

    function createFormulaCard(formula){
      const card = document.createElement("div");
      card.className = "formula-card";

      const label = document.createElement("div");
      label.className = "formula-label";
      label.textContent = pick(formula.label);

      const tex = document.createElement("div");
      tex.className = "formula-tex";
      tex.textContent = formula.tex || formula.value || "";

      card.appendChild(label);
      card.appendChild(tex);
      return card;
    }

    function createDetailTable(table){
      const wrap = document.createElement("div");
      wrap.className = "table-wrap";

      const el = document.createElement("table");
      el.className = "detail-table";

      const thead = document.createElement("thead");
      const headerRow = document.createElement("tr");
      pickArray(table.columns).forEach(col => {
        const th = document.createElement("th");
        th.textContent = col;
        headerRow.appendChild(th);
      });
      thead.appendChild(headerRow);
      el.appendChild(thead);

      const tbody = document.createElement("tbody");
      (table.rows || []).forEach(row => {
        const tr = document.createElement("tr");
        row.forEach(cell => {
          const td = document.createElement("td");
          td.textContent = pick(cell);
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
      el.appendChild(tbody);
      wrap.appendChild(el);
      return wrap;
    }

    function createDetailSection(section){
      const el = document.createElement("section");
      el.className = "detail-section";

      const title = document.createElement("h2");
      title.textContent = pick(section.title);
      el.appendChild(title);

      const lead = pick(section.lead);
      if(lead){
        const leadEl = document.createElement("div");
        leadEl.className = "detail-lead";
        leadEl.textContent = lead;
        el.appendChild(leadEl);
      }

      const paragraphs = pickArray(section.paragraphs);
      if(paragraphs.length){
        const copy = document.createElement("div");
        copy.className = "detail-copy";
        paragraphs.forEach(text => {
          const p = document.createElement("p");
          p.textContent = text;
          copy.appendChild(p);
        });
        el.appendChild(copy);
      }

      const bullets = pickArray(section.bullets);
      if(bullets.length){
        const bulletsWrap = document.createElement("div");
        bulletsWrap.className = "detail-bullets";
        bullets.forEach(text => bulletsWrap.appendChild(createBullet(text)));
        el.appendChild(bulletsWrap);
      }

      if(section.formulas && section.formulas.length){
        const formulas = document.createElement("div");
        formulas.className = "formula-grid";
        section.formulas.forEach(f => formulas.appendChild(createFormulaCard(f)));
        el.appendChild(formulas);
      }

      if(section.table){
        el.appendChild(createDetailTable(section.table));
      }

      return el;
    }

    function render(){
      const lang = getLang();
      const T = UI_TEXT[lang];

      if(!project){
        document.body.innerHTML = `
          <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;text-align:center;padding:2rem;">
            <h1 style="font-size:2rem;margin-bottom:1rem;background:linear-gradient(135deg,#667eea,#764ba2,#f093fb);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">
              ${escapeHtml(T.notFoundTitle)}
            </h1>
            <p style="color:#666;max-width:700px;line-height:1.7;">
              ${escapeHtml(T.notFoundDesc)}
            </p>
            <a href="index.html" class="back-btn" style="margin-top:1.8rem;">${escapeHtml(T.goHome)}</a>
          </div>
        `;
        return;
      }

      const title = pick(project.title);
      const company = pick(project.company);
      const description = pick(project.description);
      const overviewTitle = pick(project.overview?.title) || T.overviewTitle;
      const overviewText = pick(project.overview?.text) || description;

      document.title = `${title} ${T.pageTitleSuffix}`;

      titleEl.textContent = title;
      companyEl.textContent = company;
      descEl.textContent = description;

      crumbTitle.textContent = title;
      periodChip.textContent = `📅 ${pick(project.period) || "—"}`;
      locChip.textContent = `📍 ${pick(project.location) || "—"}`;

      // Tech tags
      techEl.innerHTML = "";
      (project.tech || []).forEach(t => techEl.appendChild(createTechTag(t)));

      // Main content
      contentEl.innerHTML = "";

      // Row: Overview + Highlights
      const row = document.createElement("div");
      row.className = "cards-row";

      const overviewCard = document.createElement("div");
      overviewCard.className = "card overview-card";
      overviewCard.innerHTML = `
        <h2>${escapeHtml(overviewTitle)}</h2>
        <div class="sublead">${escapeHtml(T.overviewSub)}</div>
        <p>${escapeHtml(overviewText)}</p>
      `;

      const highlightCard = document.createElement("div");
      highlightCard.className = "card";
      highlightCard.innerHTML = `
        <h2>${escapeHtml(T.highlightsTitle)}</h2>
        <div class="sublead">${escapeHtml(T.highlightsSub)}</div>
      `;

      const resp = (project.responsibilities && project.responsibilities[lang]) ? project.responsibilities[lang] : [];
      const kpis = (project.kpis || []);

      const bulletsWrap = document.createElement("div");
      bulletsWrap.className = "bullets";
      resp.forEach(r => bulletsWrap.appendChild(createBullet(r)));
      if(resp.length === 0){
        bulletsWrap.appendChild(createBullet(lang==="tr"
          ? "Detaylar yakında genişletilecek (CV bazlı içerik güncelleniyor)."
          : "Details will be expanded soon (CV-aligned content is being updated)."
        ));
      }

      const kpiGrid = document.createElement("div");
      kpiGrid.className = "kpi-grid";
      kpis.forEach(k => kpiGrid.appendChild(createKpi(pick(k.label), k.value)));

      highlightCard.appendChild(bulletsWrap);
      if(kpis.length) highlightCard.appendChild(kpiGrid);

      row.appendChild(overviewCard);
      row.appendChild(highlightCard);
      contentEl.appendChild(row);

      // Research-style detail sections
      (project.details || []).forEach(section => {
        contentEl.appendChild(createDetailSection(section));
      });

      // Image sections
      const imgs = project.images || [];
      imgs.forEach((img, index) => {
        const section = document.createElement("div");
        section.className = "image-section";

        const src = img.src || imagePath(project.id, index + 1);
        const imgTitle = pick(img.title) || (lang==="tr" ? "Detay" : "Detail");
        const imgDesc = pick(img.desc) || "";
        const alt = `${title} - ${imgTitle}`;

        section.innerHTML = `
          <img src="${src}" alt="${escapeHtml(alt)}" class="project-image" data-src="${src}"
               onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
          <div class="image-placeholder" style="display:none;">
            <div style="filter: drop-shadow(0 10px 20px rgba(0,0,0,.18));">${escapeHtml(project.icon || "📌")}</div>
            <div class="placeholder-sub">${escapeHtml(T.imgMissing)}</div>
          </div>
          <h3>${escapeHtml(imgTitle)}</h3>
          <p>${escapeHtml(imgDesc)}</p>
        `;

        const imageEl = section.querySelector(".project-image");
        if(imageEl){
          imageEl.addEventListener("click", () => {
            if(getComputedStyle(imageEl).display !== "none"){
              openLightbox(imageEl.getAttribute("data-src"), imageEl.alt);
            }
          });
        }

        contentEl.appendChild(section);
      });

      if(window.MathJax && window.MathJax.typesetPromise){
        window.MathJax.typesetPromise([contentEl]).catch(() => {});
      }
    }

    // İlk yükleme
    applyLang(getLang());
    render();
  </script>
</body>
</html>
