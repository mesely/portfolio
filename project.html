<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Proje Detayı</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root{
      --g1:#667eea;
      --g2:#764ba2;
      --g3:#f093fb;

      --text:#1a1a1a;
      --muted:#666;
      --bg:#ffffff;
      --bg-soft:#f8f9fa;
      --border:#e9ecef;

      --radius: 20px;
      --radius-sm: 12px;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      --shadow-2: 0 8px 25px rgba(0, 0, 0, 0.10);
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      min-height: 100vh;
      color: var(--text);
      overflow-x: hidden;
    }

    /* Navigation */
    nav {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem 5%;
      background: rgba(248, 249, 250, 0.85);
      backdrop-filter: blur(10px);
      border-bottom: 2px solid var(--border);
      gap: 1rem;
    }

    .nav-left{
      display: flex;
      align-items: center;
      gap: 1rem;
      min-width: 0;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.8rem 1.5rem;
      background: linear-gradient(135deg, var(--g1), var(--g2));
      border: none;
      border-radius: 10px;
      color: #fff;
      text-decoration: none;
      transition: all 0.3s;
      font-weight: 800;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.22);
      white-space: nowrap;
    }
    .back-btn:hover {
      transform: translateX(-5px);
      box-shadow: 0 6px 22px rgba(102, 126, 234, 0.30);
    }

    .crumb{
      color: var(--muted);
      font-weight: 800;
      font-size: 0.95rem;
      display: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 52vw;
    }
    @media (min-width: 900px){
      .crumb{ display: block; }
    }

    .nav-actions{
      display: flex;
      gap: 0.75rem;
      align-items: center;
      justify-content: flex-end;
      flex-shrink: 0;
    }

    /* ===== Language Switch (Top Right inside nav) ===== */
    .lang-switch{
      display: inline-flex;
      gap: .45rem;
      padding: .35rem;
      border-radius: 999px;
      background: rgba(255,255,255,.75);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(0,0,0,.06);
      box-shadow: 0 10px 22px rgba(0,0,0,.08);
    }
    .lang-btn{
      border: none;
      cursor: pointer;
      padding: .55rem .9rem;
      border-radius: 999px;
      font-weight: 900;
      font-size: .9rem;
      color: var(--muted);
      background: transparent;
      transition: all .2s ease;
      white-space: nowrap;
    }
    .lang-btn:hover{
      background: rgba(102,126,234,.10);
      color: var(--g2);
    }
    .lang-btn.active{
      background: linear-gradient(135deg, var(--g1), var(--g2));
      color: #fff;
      box-shadow: 0 10px 18px rgba(102,126,234,.18);
    }

    /* Project Header */
    .project-header {
      text-align: center;
      padding: 4rem 5% 2rem;
      background: var(--bg);
      position: relative;
      overflow: hidden;
    }

    .project-header::before{
      content:"";
      position:absolute;
      width: 900px;
      height: 900px;
      left: 50%;
      top: 20%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle at center,
        rgba(102,126,234,.18),
        rgba(118,75,162,.12),
        rgba(240,147,251,.06),
        transparent 70%);
      filter: blur(10px);
      pointer-events:none;
    }

    .project-header h1 {
      font-size: 3rem;
      margin-bottom: 0.75rem;
      background: linear-gradient(135deg, var(--g1), var(--g2), var(--g3));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      position: relative;
      z-index: 1;
    }

    .meta-row{
      display:flex;
      gap: 0.75rem;
      justify-content:center;
      align-items:center;
      flex-wrap: wrap;
      margin-bottom: 1rem;
      position: relative;
      z-index: 1;
    }

    .company-badge {
      display: inline-block;
      background: linear-gradient(135deg, var(--g1), var(--g2));
      color: #fff;
      padding: 0.6rem 1.4rem;
      border-radius: 999px;
      font-size: 1.05rem;
      font-weight: 950;
      box-shadow: 0 8px 18px rgba(0,0,0,.10);
    }

    .meta-chip{
      display:inline-flex;
      align-items:center;
      gap: .5rem;
      padding: 0.55rem 1rem;
      border-radius: 999px;
      border: 1px solid rgba(0,0,0,.06);
      background: rgba(255,255,255,.70);
      color: var(--muted);
      font-weight: 850;
      box-shadow: 0 8px 18px rgba(0,0,0,.06);
    }

    .description {
      font-size: 1.15rem;
      color: var(--muted);
      max-width: 900px;
      margin: 0 auto;
      line-height: 1.75;
      position: relative;
      z-index: 1;
    }

    /* Tech Stack */
    .tech-stack {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.8rem;
      padding: 1.6rem 5%;
      background: var(--bg-soft);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    .tech-tag {
      background: linear-gradient(135deg, var(--g1), var(--g2));
      color: #fff;
      padding: 0.6rem 1.2rem;
      border-radius: 999px;
      font-weight: 950;
      font-size: 0.92rem;
      box-shadow: 0 10px 18px rgba(102,126,234,.18);
    }

    /* Content Layout */
    .project-content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2.25rem 5% 4.5rem;
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.4rem;
    }

    /* Daha dengeli: 1fr / 1fr */
    .cards-row{
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.4rem;
      align-items: stretch;
    }

    @media (max-width: 980px){
      .cards-row{ grid-template-columns: 1fr; }
    }

    .card {
      background: #fff;
      border-radius: var(--radius);
      padding: 2.1rem;
      border: 2px solid var(--border);
      box-shadow: var(--shadow);
      animation: fadeInUp .6s ease-out;
      height: 100%;
    }

    /* ÖZET kartını daha "ortada" hissettirmek için */
    .card.overview-card{
      display:flex;
      flex-direction:column;
      justify-content:center;   /* dikeyde ortalar */
      text-align:left;          /* okunabilirlik için solda */
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(26px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card h2{
      font-size: 1.55rem;
      margin-bottom: .7rem;
      color: var(--g2);
      letter-spacing: .2px;
    }

    .card .sublead{
      color: var(--muted);
      font-weight: 800;
      line-height: 1.6;
      margin-bottom: 1rem;
      font-size: 1.02rem;
    }

    .card p{
      font-size: 1.08rem;
      line-height: 1.85;
      color: #444;
    }

    .bullets{
      margin-top: .75rem;
      display: grid;
      gap: .65rem;
    }

    .bullet{
      display:flex;
      gap: .8rem;
      align-items:flex-start;
      padding: .9rem 1rem;
      border-radius: 14px;
      background: rgba(102,126,234,.06);
      border: 1px solid rgba(102,126,234,.18);
    }

    .bullet .dot{
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--g1), var(--g2));
      margin-top: .38rem;
      flex-shrink: 0;
      box-shadow: 0 6px 14px rgba(102,126,234,.25);
    }

    .bullet div{
      color:#333;
      line-height: 1.7;
      font-size: 1.02rem;
      font-weight: 700;
    }

    .kpi-grid{
      display:grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: .9rem;
      margin-top: .95rem;
    }

    .kpi{
      padding: 1rem 1rem;
      border-radius: 16px;
      border: 1px solid rgba(0,0,0,.06);
      background: #fff;
      box-shadow: 0 10px 18px rgba(0,0,0,.06);
    }
    .kpi .label{
      color: var(--muted);
      font-weight: 950;
      font-size: .9rem;
      margin-bottom: .25rem;
    }
    .kpi .value{
      font-weight: 950;
      font-size: 1.15rem;
      background: linear-gradient(135deg, var(--g1), var(--g2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    @media (max-width: 520px){
      .kpi-grid{ grid-template-columns: 1fr; }
    }

    /* Image sections */
    .image-section {
      background: #ffffff;
      border-radius: var(--radius);
      padding: 2.2rem;
      border: 2px solid var(--border);
      box-shadow: var(--shadow);
      animation: fadeInUp 0.6s ease-out;
    }

    .image-section:nth-child(2) { animation-delay: 0.12s; }
    .image-section:nth-child(3) { animation-delay: 0.24s; }
    .image-section:nth-child(4) { animation-delay: 0.36s; }

    /* Görsel crop yok: contain + oran korunur */
    .project-image {
      width: 100%;
      height: auto;
      border-radius: 16px;
      margin-bottom: 1.2rem;
      box-shadow: var(--shadow-2);
      object-fit: contain;
      max-height: 85vh;
      background: #fff;
      cursor: zoom-in;
      display: block;
    }

    .image-placeholder {
      width: 100%;
      min-height: 420px;
      background: linear-gradient(135deg, var(--g1) 0%, var(--g2) 50%, var(--g3) 100%);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      gap: .4rem;
      align-items: center;
      justify-content: center;
      font-size: 4.6rem;
      margin-bottom: 1.2rem;
      box-shadow: var(--shadow-2);
      color: #fff;
      text-align:center;
      padding: 1rem;
    }

    .placeholder-sub{
      font-size: 1rem;
      opacity: .95;
      font-weight: 950;
      letter-spacing: .2px;
    }

    .image-section h3 {
      font-size: 1.35rem;
      margin-bottom: 0.6rem;
      color: var(--g2);
    }

    .image-section p {
      font-size: 1.06rem;
      line-height: 1.85;
      color: #444;
    }

    /* Lightbox */
    .lightbox{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 1.2rem;
    }
    .lightbox.active{ display:flex; }

    .lightbox-inner{
      max-width: 1100px;
      width: 100%;
      position: relative;
      animation: fadeInUp .25s ease-out;
    }

    .lightbox-img{
      width: 100%;
      border-radius: 18px;
      box-shadow: 0 18px 50px rgba(0,0,0,.35);
      max-height: 85vh;
      object-fit: contain;
      background: #111;
    }

    .lightbox-close{
      position:absolute;
      top: -14px;
      right: -14px;
      width: 44px;
      height: 44px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      font-weight: 900;
      color: #fff;
      background: linear-gradient(135deg, var(--g1), var(--g2));
      box-shadow: 0 10px 20px rgba(0,0,0,.25);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .project-header h1 { font-size: 2rem; }
      .image-section, .card { padding: 1.4rem; }
      nav { padding: 1.05rem 5%; }
      .project-image { max-height: 65vh; }
      .image-placeholder { min-height: 300px; font-size: 3.8rem; }
    }
  </style>
</head>

<body>
  <nav>
    <div class="nav-left">

      return (saved === "en" || saved === "tr") ? saved : "tr";

    function setLang(lang){
      localStorage.setItem("lang", lang);
      applyLang(lang);
      render(); // içerikler dil değiştirsin

      document.documentElement.lang = lang;
      btnTR.classList.toggle("active", lang === "tr");
      btnEN.classList.toggle("active", lang === "en");

      document.getElementById("backBtnText").textContent = UI_TEXT[lang].back;
      document.getElementById("crumbPrefix").textContent = UI_TEXT[lang].crumbPrefix;

      document.getElementById("lightboxClose").setAttribute("aria-label", UI_TEXT[lang].close);
      document.getElementById("lightboxImg").alt = (lang === "tr" ? "Proje görseli" : "Project image");
    }

    btnTR.addEventListener("click", () => setLang("tr"));
    btnEN.addEventListener("click", () => setLang("en"));

    // ============ GERİ UYUMLULUK / ÖNCELİK ============
    function resolveProject(){
      const id = localStorage.getItem("currentProjectId");
      if(id && PROJECTS[id]) return PROJECTS[id];

      const raw = localStorage.getItem("currentProject");
      if(raw){
        try{
          const obj = JSON.parse(raw);
          if(obj && obj.title && obj.company){
            return normalizeLegacy(obj);
          }
        }catch(e){}
      }
      return null;
    }

    function normalizeLegacy(legacy){
      const id = legacy.imagePrefix || "project";
      const iconMap = {
        chefinpocket:"🍳", baykar:"🎯", bmc:"💬", intertech:"💰", arastirma:"🗣️",
        influencer:"📊", echospace:"🥽", music:"🎵", sneakpeek:"🛍️"
      };

      return {
        id,
        icon: iconMap[id] || "✨",
        title: { tr: legacy.title || "Proje", en: legacy.title || "Project" },
        company: { tr: legacy.company || "—", en: legacy.company || "—" },
        period: legacy.period || "—",
        location: legacy.location || "—",
        description: { tr: legacy.description || "", en: legacy.description || "" },
        tech: legacy.tech || [],
        overview: {
          title: { tr: "Özet", en: "Summary" },
          text: { tr: legacy.description || "", en: legacy.description || "" }
        },
        responsibilities: {
          tr: legacy.responsibilities || [],
          en: legacy.responsibilities || []
        },
        kpis: (legacy.kpis || []).map(k => ({
          label: { tr: k.label, en: k.label },
          value: k.value
        })),
        images: (legacy.images || []).map(x => ({
          title: { tr: x.title, en: x.title },
          desc: { tr: x.desc, en: x.desc }
        }))
      };
    }

    // ============ UI ============
    const project = resolveProject();

    const titleEl = document.getElementById("project-title");
    const companyEl = document.getElementById("company");
    const descEl = document.getElementById("description");
    const techEl = document.getElementById("tech-stack");
    const contentEl = document.getElementById("project-content");

    const crumbTitle = document.getElementById("crumbTitle");
    const periodChip = document.getElementById("periodChip");
    const locChip = document.getElementById("locChip");

    // Lightbox
    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightboxImg");
    const lightboxClose = document.getElementById("lightboxClose");

    function openLightbox(src, alt){
      lightboxImg.src = src;
      lightboxImg.alt = alt || (getLang()==="tr" ? "Proje görseli" : "Project image");
      lightbox.classList.add("active");
      lightbox.setAttribute("aria-hidden","false");
    }
    function closeLightbox(){
      lightbox.classList.remove("active");
      lightbox.setAttribute("aria-hidden","true");
      lightboxImg.src = "";
    }
    lightbox.addEventListener("click", (e) => {
      if(e.target === lightbox) closeLightbox();
    });
    lightboxClose.addEventListener("click", closeLightbox);
    document.addEventListener("keydown", (e) => {
      if(e.key === "Escape") closeLightbox();
    });

    function escapeHtml(str){
      return String(str ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function pick(obj){
      const lang = getLang();
      if(obj && typeof obj === "object" && (obj.tr || obj.en)){
        return obj[lang] || obj.tr || obj.en || "";
      }
      return obj ?? "";
    }

    function imagePath(prefix, idx){
      return `images/${prefix}${idx}.png`;
    }

    function createTechTag(t){
      const div = document.createElement("div");
      div.className = "tech-tag";
      div.textContent = t;
      return div;
    }

    function createBullet(text){
      const row = document.createElement("div");
      row.className = "bullet";
      row.innerHTML = `<div class="dot"></div><div>${escapeHtml(text)}</div>`;
      return row;
    }

    function createKpi(label, value){
      const box = document.createElement("div");
      box.className = "kpi";
      box.innerHTML = `<div class="label">${escapeHtml(label)}</div><div class="value">${escapeHtml(value)}</div>`;
      return box;
    }

    function render(){
      const lang = getLang();
      const T = UI_TEXT[lang];

      if(!project){
        document.body.innerHTML = `
          <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;text-align:center;padding:2rem;">
            <h1 style="font-size:2rem;margin-bottom:1rem;background:linear-gradient(135deg,#667eea,#764ba2,#f093fb);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">
              ${escapeHtml(T.notFoundTitle)}
            </h1>
            <p style="color:#666;max-width:700px;line-height:1.7;">
              ${escapeHtml(T.notFoundDesc)}
            </p>
            <a href="index.html" class="back-btn" style="margin-top:1.8rem;">${escapeHtml(T.goHome)}</a>
          </div>
        `;
        return;
      }

      const title = pick(project.title);
      const company = pick(project.company);
      const description = pick(project.description);
      const overviewTitle = pick(project.overview?.title) || T.overviewTitle;
      const overviewText = pick(project.overview?.text) || description;

      document.title = `${title} ${T.pageTitleSuffix}`;

      titleEl.textContent = title;
      companyEl.textContent = company;
      descEl.textContent = description;

      crumbTitle.textContent = title;
      periodChip.textContent = `📅 ${project.period || "—"}`;
      locChip.textContent = `📍 ${project.location || "—"}`;

      // Tech tags
      techEl.innerHTML = "";
      (project.tech || []).forEach(t => techEl.appendChild(createTechTag(t)));

      // Main content
      contentEl.innerHTML = "";

      // Row: Overview + Highlights
      const row = document.createElement("div");
      row.className = "cards-row";

      const overviewCard = document.createElement("div");
      overviewCard.className = "card overview-card";
      overviewCard.innerHTML = `
        <h2>${escapeHtml(overviewTitle)}</h2>
        <div class="sublead">${escapeHtml(T.overviewSub)}</div>
        <p>${escapeHtml(overviewText)}</p>
      `;

      const highlightCard = document.createElement("div");
      highlightCard.className = "card";
      highlightCard.innerHTML = `
        <h2>${escapeHtml(T.highlightsTitle)}</h2>
        <div class="sublead">${escapeHtml(T.highlightsSub)}</div>
      `;

      const resp = (project.responsibilities && project.responsibilities[lang]) ? project.responsibilities[lang] : [];
      const kpis = (project.kpis || []);

      const bulletsWrap = document.createElement("div");
      bulletsWrap.className = "bullets";
      resp.forEach(r => bulletsWrap.appendChild(createBullet(r)));
      if(resp.length === 0){
        bulletsWrap.appendChild(createBullet(lang==="tr"
          ? "Detaylar yakında genişletilecek (CV bazlı içerik güncelleniyor)."
          : "Details will be expanded soon (CV-aligned content is being updated)."
        ));
      }

      const kpiGrid = document.createElement("div");
      kpiGrid.className = "kpi-grid";
      kpis.forEach(k => kpiGrid.appendChild(createKpi(pick(k.label), k.value)));

      highlightCard.appendChild(bulletsWrap);
      if(kpis.length) highlightCard.appendChild(kpiGrid);

      row.appendChild(overviewCard);
      row.appendChild(highlightCard);
      contentEl.appendChild(row);

      // Image sections
      const imgs = project.images || [];
      imgs.forEach((img, index) => {
        const section = document.createElement("div");
        section.className = "image-section";

        const src = imagePath(project.id, index + 1);
        const imgTitle = pick(img.title) || (lang==="tr" ? "Detay" : "Detail");
        const imgDesc = pick(img.desc) || "";
        const alt = `${title} - ${imgTitle}`;

        section.innerHTML = `
          <img src="${src}" alt="${escapeHtml(alt)}" class="project-image" data-src="${src}"
               onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
          <div class="image-placeholder" style="display:none;">
            <div style="filter: drop-shadow(0 10px 20px rgba(0,0,0,.18));">${escapeHtml(project.icon || "📌")}</div>
            <div class="placeholder-sub">${escapeHtml(T.imgMissing)}</div>
          </div>
          <h3>${escapeHtml(imgTitle)}</h3>
          <p>${escapeHtml(imgDesc)}</p>
        `;

        const imageEl = section.querySelector(".project-image");
        if(imageEl){
          imageEl.addEventListener("click", () => {
            if(getComputedStyle(imageEl).display !== "none"){
              openLightbox(imageEl.getAttribute("data-src"), imageEl.alt);
            }
          });
        }

        contentEl.appendChild(section);
      });
    }

    // İlk yükleme
    applyLang(getLang());
    render();
  </script>
</body>
