<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Proje Detayı</title>
  <script src="project-translations.js"></script>
<script src="portfolio-current.js"></script>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [["\\(", "\\)"]],
        displayMath: [["\\[", "\\]"]]
      },
      svg: { fontCache: "global" }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root{
      --g1:#667eea;
      --g2:#764ba2;
      --g3:#f093fb;

      --text:#1a1a1a;
      --muted:#666;
      --bg:#ffffff;
      --bg-soft:#f8f9fa;
      --border:#e9ecef;

      --radius: 20px;
      --radius-sm: 12px;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      --shadow-2: 0 8px 25px rgba(0, 0, 0, 0.10);
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      min-height: 100vh;
      color: var(--text);
      overflow-x: hidden;
    }

    /* Navigation */
    nav {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem 5%;
      background: rgba(248, 249, 250, 0.85);
      backdrop-filter: blur(10px);
      border-bottom: 2px solid var(--border);
      gap: 1rem;
    }

    .nav-left{
      display: flex;
      align-items: center;
      gap: 1rem;
      min-width: 0;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.8rem 1.5rem;
      background: linear-gradient(135deg, var(--g1), var(--g2));
      border: none;
      border-radius: 10px;
      color: #fff;
      text-decoration: none;
      transition: all 0.3s;
      font-weight: 800;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.22);
      white-space: nowrap;
    }
    .back-btn:hover {
      transform: translateX(-5px);
      box-shadow: 0 6px 22px rgba(102, 126, 234, 0.30);
    }

    .crumb{
      color: var(--muted);
      font-weight: 800;
      font-size: 0.95rem;
      display: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 52vw;
    }
    @media (min-width: 900px){
      .crumb{ display: block; }
    }

    .nav-actions{
      display: flex;
      gap: 0.75rem;
      align-items: center;
      justify-content: flex-end;
      flex-shrink: 0;
    }

    /* ===== Language Switch (Top Right inside nav) ===== */
    .lang-switch{
      display: inline-flex;
      gap: .45rem;
      padding: .35rem;
      border-radius: 999px;
      background: rgba(255,255,255,.75);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(0,0,0,.06);
      box-shadow: 0 10px 22px rgba(0,0,0,.08);
    }
    .lang-btn{
      border: none;
      cursor: pointer;
      padding: .55rem .9rem;
      border-radius: 999px;
      font-weight: 900;
      font-size: .9rem;
      color: var(--muted);
      background: transparent;
      transition: all .2s ease;
      white-space: nowrap;
    }
    .lang-btn:hover{
      background: rgba(102,126,234,.10);
      color: var(--g2);
    }
    .lang-btn.active{
      background: linear-gradient(135deg, var(--g1), var(--g2));
      color: #fff;
      box-shadow: 0 10px 18px rgba(102,126,234,.18);
    }

    /* Project Header */
    .project-header {
      text-align: center;
      padding: 4rem 5% 2rem;
      background: var(--bg);
      position: relative;
      overflow: hidden;
    }

    .project-header::before{
      content:"";
      position:absolute;
      width: 900px;
      height: 900px;
      left: 50%;
      top: 20%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle at center,
        rgba(102,126,234,.18),
        rgba(118,75,162,.12),
        rgba(240,147,251,.06),
        transparent 70%);
      filter: blur(10px);
      pointer-events:none;
    }

    .project-header h1 {
      font-size: 3rem;
      margin-bottom: 0.75rem;
      background: linear-gradient(135deg, var(--g1), var(--g2), var(--g3));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      position: relative;
      z-index: 1;
    }

    .meta-row{
      display:flex;
      gap: 0.75rem;
      justify-content:center;
      align-items:center;
      flex-wrap: wrap;
      margin-bottom: 1rem;
      position: relative;
      z-index: 1;
    }

    .company-badge {
      display: inline-block;
      background: linear-gradient(135deg, var(--g1), var(--g2));
      color: #fff;
      padding: 0.6rem 1.4rem;
      border-radius: 999px;
      font-size: 1.05rem;
      font-weight: 950;
      box-shadow: 0 8px 18px rgba(0,0,0,.10);
    }

    .meta-chip{
      display:inline-flex;
      align-items:center;
      gap: .5rem;
      padding: 0.55rem 1rem;
      border-radius: 999px;
      border: 1px solid rgba(0,0,0,.06);
      background: rgba(255,255,255,.70);
      color: var(--muted);
      font-weight: 850;
      box-shadow: 0 8px 18px rgba(0,0,0,.06);
    }

    .description {
      font-size: 1.15rem;
      color: var(--muted);
      max-width: 900px;
      margin: 0 auto;
      line-height: 1.75;
      position: relative;
      z-index: 1;
    }

    /* Tech Stack */
    .tech-stack {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.8rem;
      padding: 1.6rem 5%;
      background: var(--bg-soft);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    .tech-tag {
      background: linear-gradient(135deg, var(--g1), var(--g2));
      color: #fff;
      padding: 0.6rem 1.2rem;
      border-radius: 999px;
      font-weight: 950;
      font-size: 0.92rem;
      box-shadow: 0 10px 18px rgba(102,126,234,.18);
    }

    /* Content Layout */
    .project-content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2.25rem 5% 4.5rem;
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.4rem;
    }

    /* Daha dengeli: 1fr / 1fr */
    .cards-row{
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.4rem;
      align-items: stretch;
    }

    @media (max-width: 980px){
      .cards-row{ grid-template-columns: 1fr; }
    }

    .card {
      background: #fff;
      border-radius: var(--radius);
      padding: 2.1rem;
      border: 2px solid var(--border);
      box-shadow: var(--shadow);
      animation: fadeInUp .6s ease-out;
      height: 100%;
    }

    /* ÖZET kartını daha "ortada" hissettirmek için */
    .card.overview-card{
      display:flex;
      flex-direction:column;
      justify-content:center;   /* dikeyde ortalar */
      text-align:left;          /* okunabilirlik için solda */
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(26px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card h2{
      font-size: 1.55rem;
      margin-bottom: .7rem;
      color: var(--g2);
      letter-spacing: .2px;
    }

    .card .sublead{
      color: var(--muted);
      font-weight: 800;
      line-height: 1.6;
      margin-bottom: 1rem;
      font-size: 1.02rem;
    }

    .card p{
      font-size: 1.08rem;
      line-height: 1.85;
      color: #444;
    }

    .bullets{
      margin-top: .75rem;
      display: grid;
      gap: .65rem;
    }

    .bullet{
      display:flex;
      gap: .8rem;
      align-items:flex-start;
      padding: .9rem 1rem;
      border-radius: 14px;
      background: rgba(102,126,234,.06);
      border: 1px solid rgba(102,126,234,.18);
    }

    .bullet .dot{
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--g1), var(--g2));
      margin-top: .38rem;
      flex-shrink: 0;
      box-shadow: 0 6px 14px rgba(102,126,234,.25);
    }

    .bullet div{
      color:#333;
      line-height: 1.7;
      font-size: 1.02rem;
      font-weight: 700;
    }

    .kpi-grid{
      display:grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: .9rem;
      margin-top: .95rem;
    }

    .kpi{
      padding: 1rem 1rem;
      border-radius: 16px;
      border: 1px solid rgba(0,0,0,.06);
      background: #fff;
      box-shadow: 0 10px 18px rgba(0,0,0,.06);
    }
    .kpi .label{
      color: var(--muted);
      font-weight: 950;
      font-size: .9rem;
      margin-bottom: .25rem;
    }
    .kpi .value{
      font-weight: 950;
      font-size: 1.15rem;
      background: linear-gradient(135deg, var(--g1), var(--g2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    @media (max-width: 520px){
      .kpi-grid{ grid-template-columns: 1fr; }
    }

    /* Research / math sections */
    .detail-section{
      background:
        linear-gradient(135deg, rgba(102,126,234,.08), rgba(240,147,251,.08)),
        #fff;
      border-radius: var(--radius);
      padding: 2.25rem;
      border: 2px solid var(--border);
      box-shadow: var(--shadow);
      animation: fadeInUp 0.6s ease-out;
      position: relative;
      overflow: hidden;
    }

    .detail-section::before{
      content: "";
      position: absolute;
      width: 240px;
      height: 240px;
      border-radius: 999px;
      right: -90px;
      top: -120px;
      background: radial-gradient(circle, rgba(102,126,234,.18), transparent 70%);
      pointer-events: none;
    }

    .detail-section h2{
      color: var(--g2);
      font-size: 1.55rem;
      margin-bottom: .65rem;
      position: relative;
    }

    .detail-lead{
      font-weight: 850;
      line-height: 1.75;
      color: #333;
      margin-bottom: 1.1rem;
      position: relative;
    }

    .detail-copy{
      display: grid;
      gap: .85rem;
      position: relative;
    }

    .detail-copy p{
      line-height: 1.85;
      color: #444;
      font-size: 1.04rem;
    }

    .detail-bullets{
      display: grid;
      gap: .7rem;
      margin-top: .35rem;
      position: relative;
    }

    .formula-grid{
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: .9rem;
      margin-top: 1.25rem;
      position: relative;
    }

    .formula-card{
      background: rgba(255,255,255,.9);
      border: 1px solid rgba(0,0,0,.08);
      border-radius: 18px;
      padding: 1rem;
      box-shadow: 0 12px 24px rgba(0,0,0,.06);
      overflow-x: auto;
    }

    .formula-label{
      color: var(--muted);
      font-size: .86rem;
      font-weight: 950;
      margin-bottom: .45rem;
      letter-spacing: .01em;
      text-transform: uppercase;
    }

    .formula-tex{
      min-width: max-content;
      color: #1f2430;
      font-size: 1.02rem;
      line-height: 1.6;
      padding: .25rem 0;
    }

    .formula-card.formula-card--compact{
      overflow-x: hidden;
    }

    .formula-card.formula-card--compact .formula-tex{
      min-width: 0;
      font-size: .62rem;
      line-height: 1.35;
      white-space: normal;
      overflow-wrap: anywhere;
    }

    .formula-card.formula-card--compact mjx-container{
      max-width: 100%;
      font-size: 72% !important;
      overflow: visible;
    }

    .formula-card.formula-card--compact svg{
      max-width: 100% !important;
      height: auto;
    }

    .table-wrap{
      margin-top: 1.25rem;
      overflow-x: auto;
      border-radius: 18px;
      border: 1px solid rgba(0,0,0,.08);
      box-shadow: 0 12px 24px rgba(0,0,0,.06);
      position: relative;
    }

    .detail-table{
      width: 100%;
      border-collapse: collapse;
      min-width: 720px;
      background: #fff;
    }

    .detail-table th,
    .detail-table td{
      padding: .9rem 1rem;
      text-align: left;
      border-bottom: 1px solid rgba(0,0,0,.07);
      vertical-align: top;
      line-height: 1.55;
    }

    .detail-table th{
      background: linear-gradient(135deg, rgba(102,126,234,.12), rgba(118,75,162,.12));
      color: var(--g2);
      font-weight: 950;
      white-space: nowrap;
    }

    .detail-table tr:last-child td{
      border-bottom: 0;
    }

    .detail-table td:first-child{
      font-weight: 900;
      color: #252531;
    }

    @media (max-width: 800px){
      .detail-section{ padding: 1.45rem; }
      .formula-grid{ grid-template-columns: 1fr; }
      .formula-tex{ font-size: .95rem; }
    }

    /* Image sections */
    .image-section {
      background: #ffffff;
      border-radius: var(--radius);
      padding: 2.2rem;
      border: 2px solid var(--border);
      box-shadow: var(--shadow);
      animation: fadeInUp 0.6s ease-out;
    }

    .image-section:nth-child(2) { animation-delay: 0.12s; }
    .image-section:nth-child(3) { animation-delay: 0.24s; }
    .image-section:nth-child(4) { animation-delay: 0.36s; }

    /* Görsel crop yok: contain + oran korunur */
    .project-image {
      width: 100%;
      height: auto;
      border-radius: 16px;
      margin-bottom: 1.2rem;
      box-shadow: var(--shadow-2);
      object-fit: contain;
      max-height: 85vh;
      background: #fff;
      cursor: zoom-in;
      display: block;
    }

    .image-placeholder {
      width: 100%;
      min-height: 420px;
      background: linear-gradient(135deg, var(--g1) 0%, var(--g2) 50%, var(--g3) 100%);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      gap: .4rem;
      align-items: center;
      justify-content: center;
      font-size: 4.6rem;
      margin-bottom: 1.2rem;
      box-shadow: var(--shadow-2);
      color: #fff;
      text-align:center;
      padding: 1rem;
    }

    .placeholder-sub{
      font-size: 1rem;
      opacity: .95;
      font-weight: 950;
      letter-spacing: .2px;
    }

    .image-section h3 {
      font-size: 1.35rem;
      margin-bottom: 0.6rem;
      color: var(--g2);
    }

    .image-section p {
      font-size: 1.06rem;
      line-height: 1.85;
      color: #444;
    }

    /* Lightbox */
    .lightbox{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 1.2rem;
    }
    .lightbox.active{ display:flex; }

    .lightbox-inner{
      max-width: 1100px;
      width: 100%;
      position: relative;
      animation: fadeInUp .25s ease-out;
    }

    .lightbox-img{
      width: 100%;
      border-radius: 18px;
      box-shadow: 0 18px 50px rgba(0,0,0,.35);
      max-height: 85vh;
      object-fit: contain;
      background: #111;
    }

    .lightbox-close{
      position:absolute;
      top: -14px;
      right: -14px;
      width: 44px;
      height: 44px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      font-weight: 900;
      color: #fff;
      background: linear-gradient(135deg, var(--g1), var(--g2));
      box-shadow: 0 10px 20px rgba(0,0,0,.25);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .project-header h1 { font-size: 2rem; }
      .image-section, .card { padding: 1.4rem; }
      nav { padding: 1.05rem 5%; }
      .project-image { max-height: 65vh; }
      .image-placeholder { min-height: 300px; font-size: 3.8rem; }
    }

    /* Academic theme overrides */
    :root{
      --ink:#1f2328;
      --muted:#5f6670;
      --paper:#ffffff;
      --soft:#f6f7f5;
      --line:#d9dfdc;
      --accent:#006b5f;
      --accent-2:#9b4f2f;
      --accent-soft:#e7f2ef;
      --radius:8px;
      --shadow:0 16px 36px rgba(31, 35, 40, 0.08);
      --shadow-2:0 16px 36px rgba(31, 35, 40, 0.12);
    }

    *{
      letter-spacing:0;
    }

    body{
      background: var(--paper);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.65;
    }

    nav{
      padding: 0.85rem 5%;
      background: rgba(255,255,255,.92);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(14px);
    }

    .back-btn{
      padding: 0.72rem 0.92rem;
      background: var(--paper);
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: none;
    }

    .back-btn:hover{
      transform: translateY(-2px);
      box-shadow: none;
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .crumb{
      color: var(--muted);
      font-size: .9rem;
      font-weight: 700;
    }

    .nav-actions{
      gap: 1rem;
    }

    .language-control{
      display:flex;
      align-items:center;
      gap:.5rem;
      color: var(--muted);
      font-size:.86rem;
      font-weight:700;
    }

    .language-control select{
      min-width:5.35rem;
      border:1px solid var(--line);
      border-radius: var(--radius);
      background: var(--paper);
      color: var(--ink);
      padding: .55rem .7rem;
      font: inherit;
      cursor:pointer;
    }

    .project-header{
      max-width: 1180px;
      margin: 0 auto;
      padding: 4.3rem 5% 1.6rem;
      text-align: left;
      background: var(--paper);
    }

    .project-header::before{
      display:none;
    }

    .project-header h1,
    .card h2,
    .detail-section h2,
    .image-section h3{
      font-family: Merriweather, Georgia, "Times New Roman", serif;
      color: var(--ink);
      background: none;
      -webkit-text-fill-color: initial;
      -webkit-background-clip: initial;
    }

    .project-header h1{
      font-size: 2.9rem;
      margin-bottom: .95rem;
      line-height: 1.16;
    }

    .meta-row{
      justify-content: flex-start;
      gap: 1.1rem;
      margin-bottom: 1rem;
    }

    .company-badge,
    .meta-chip{
      background: none;
      color: var(--muted);
      padding: 0;
      border: 0;
      border-radius: 0;
      box-shadow: none;
      font-size: .9rem;
      font-weight: 750;
    }

    .company-badge{
      color: var(--ink);
      font-weight: 850;
      text-transform: uppercase;
      letter-spacing: .04em;
      font-size: .78rem;
    }

    .description{
      max-width: 880px;
      margin: 0;
      color: var(--muted);
      font-size: 1.03rem;
      line-height: 1.8;
    }

    .tech-stack{
      max-width:1180px;
      margin: 0 auto;
      padding: 0 5% 1.4rem;
      justify-content:flex-start;
      gap: 0;
      background: none;
      border: 0;
    }

    .tech-tag{
      background: none;
      color: var(--muted);
      padding: 0;
      border-radius: 0;
      box-shadow: none;
      font-size: .9rem;
      font-weight: 650;
    }

    .tech-tag:not(:last-child)::after{
      content: " · ";
      color: var(--muted);
      font-weight: 400;
    }

    .project-content{
      max-width:1180px;
      padding: 0 5% 4rem;
      gap: 1rem;
    }

    .card,
    .detail-section,
    .image-section{
      border:1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      background: var(--paper);
      padding: 1.35rem;
    }

    .card h2,
    .detail-section h2{
      font-size: 1.3rem;
      margin-bottom: .65rem;
    }

    .card .sublead,
    .detail-lead{
      color: var(--muted);
      font-size: .92rem;
      font-weight: 700;
      margin-bottom: .9rem;
    }

    .card p,
    .detail-copy p,
    .image-section p{
      color: var(--muted);
      font-size: .98rem;
      line-height: 1.8;
    }

    .bullet{
      padding: .85rem 0 .85rem .9rem;
      border-radius: 0;
      background: none;
      border: 0;
      border-left: 2px solid var(--accent);
    }

    .bullet .dot{
      width: 7px;
      height: 7px;
      margin-top: .47rem;
      background: var(--accent);
      box-shadow: none;
    }

    .bullet div{
      color: var(--ink);
      font-size: .97rem;
      font-weight: 650;
    }

    .kpi{
      border:1px solid var(--line);
      border-radius: var(--radius);
      box-shadow:none;
      padding: .9rem;
    }

    .kpi .label{
      color: var(--muted);
      font-size: .8rem;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .kpi .value{
      color: var(--ink);
      background: none;
      -webkit-text-fill-color: initial;
      font-size: 1.02rem;
    }

    .detail-section{
      background: var(--paper);
      overflow: visible;
    }

    .detail-section::before{
      display:none;
    }

    .formula-card{
      background: var(--soft);
      border:1px solid var(--line);
      border-radius: var(--radius);
      box-shadow:none;
    }

    .formula-label{
      color: var(--muted);
      font-size: .78rem;
    }

    .table-wrap{
      border-radius: var(--radius);
      border:1px solid var(--line);
      box-shadow:none;
    }

    .detail-table th{
      background: var(--soft);
      color: var(--ink);
    }

    .image-section h3{
      font-size: 1.18rem;
      margin-bottom: .55rem;
    }

    .project-image{
      border-radius: var(--radius);
      background: var(--soft);
    }

    .lightbox-close{
      border-radius: var(--radius);
      background: var(--ink);
      color: var(--paper);
      box-shadow: none;
    }

    .lightbox-img{
      border-radius: var(--radius);
    }

    @media (max-width: 768px){
      .project-header{
        padding-top: 3rem;
      }

      .project-header h1{
        font-size: 2.15rem;
      }

      .language-control span{
        display:none;
      }

      .meta-row{
        flex-direction: column;
        align-items: flex-start;
        gap: .35rem;
      }
    }
  </style>
<link rel="stylesheet" href="portfolio-style.css" />

<body>
  <nav>
    <div class="nav-left">
      <a href="index.html" class="back-btn" id="backBtn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        <span id="backBtnText">Geri Dön</span>
      </a>
      <div class="crumb" id="crumb">
        <span id="crumbPrefix">Projeler / </span><span style="color:#1a1a1a" id="crumbTitle">—</span>
      </div>
    </div>

    <div class="nav-actions">
      <label class="language-control" for="languageSelect">
        <span id="langLabel">Language</span>
        <select id="languageSelect" aria-label="Language">
          <option value="en">EN</option>
          <option value="tr">TR</option>
          <option value="de">DE</option>
          <option value="fr">FR</option>
          <option value="nl">NL</option>
          <option value="da">DA</option>
          <option value="sv">SV</option>
          <option value="fi">FI</option>
        </select>
      </label>
    </div>
  </nav>

  <div class="project-header">
    <h1 id="project-title"></h1>

    <div class="meta-row">
      <div class="company-badge" id="company"></div>
      <div class="meta-chip" id="periodChip">—</div>
      <div class="meta-chip" id="locChip">—</div>
    </div>

    <p class="description" id="description"></p>
  </div>

  <div class="tech-stack" id="tech-stack"></div>

  <div class="project-content" id="project-content"></div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" aria-hidden="true">
    <div class="lightbox-inner">
      <button class="lightbox-close" id="lightboxClose" aria-label="Kapat">✕</button>
      <img class="lightbox-img" id="lightboxImg" alt="Proje görseli" />
    </div>
  </div>

  <script>
    // ===== Dil (index ile aynı key) =====
    const SUPPORTED_LANGS = ["en", "tr", "de", "fr", "nl", "da", "sv", "fi"];
    const languageSelect = document.getElementById("languageSelect");
    const langLabel = document.getElementById("langLabel");

    function getLang(){
      const requested=new URLSearchParams(location.search).get("lang");
      if(SUPPORTED_LANGS.includes(requested)) return requested;
      const portfolioLang = localStorage.getItem("portfolioLanguageV2");
      const saved = localStorage.getItem("lang");
      if(SUPPORTED_LANGS.includes(portfolioLang)) return portfolioLang;
      if(saved === "tr") return "tr";
      return "en";
    }
    function setLang(lang){
      const next = SUPPORTED_LANGS.includes(lang) ? lang : "en";
      const nextUrl=new URL(location.href);nextUrl.searchParams.set("lang",next);history.replaceState(null,"",nextUrl);
      localStorage.setItem("portfolioLanguageV2", next);
      localStorage.setItem("lang", next === "tr" ? "tr" : "en");
      languageSelect.value = next;
      applyLang(next);
      render(); // içerikler dil değiştirsin
    }

    function uiCopy(lang){
      return UI_TEXT[lang] || UI_TEXT.en;
    }

    const UI_TEXT = {
      tr: {
        languageLabel: "Dil",
        back: "Geri Dön",
        crumbPrefix: "Projeler / ",
        notFoundTitle: "Proje bulunamadı",
        notFoundDesc: "Proje bilgisi bulunamadı. Lütfen ana sayfadan bir projeyi tekrar aç.",
        goHome: "Ana Sayfaya Dön",
        overviewTitle: "Özet",
        overviewSub: "Araştırma çerçevesi, kapsam ve hedef.",
        highlightsTitle: "Katkılar",
        highlightsSub: "Doğrudan üstlendiğim teknik sorumluluklar ve ölçülebilir çıktılar.",
        imgMissing: "Görsel bulunamadı",
        close: "Kapat",
        pageTitleSuffix: "— Proje Detayı",
      },
      en: {
        languageLabel: "Language",
        back: "Back",
        crumbPrefix: "Projects / ",
        notFoundTitle: "Project not found",
        notFoundDesc: "Project details could not be loaded. Please open a project again from the home page.",
        goHome: "Go to Home",
        overviewTitle: "Summary",
        overviewSub: "Research framing, scope, and objective.",
        highlightsTitle: "Contributions",
        highlightsSub: "Direct technical responsibilities and measurable outputs.",
        imgMissing: "Image not found",
        close: "Close",
        pageTitleSuffix: "— Project Details",
      },
      de: {
        languageLabel: "Sprache",
        back: "Zurück",
        crumbPrefix: "Projekte / ",
        notFoundTitle: "Projekt nicht gefunden",
        notFoundDesc: "Projektdetails konnten nicht geladen werden. Bitte öffne ein Projekt erneut von der Startseite.",
        goHome: "Zur Startseite",
        overviewTitle: "Zusammenfassung",
        overviewSub: "Forschungsrahmen, Umfang und Zielsetzung.",
        highlightsTitle: "Beiträge",
        highlightsSub: "Direkte technische Verantwortung und messbare Ergebnisse.",
        imgMissing: "Bild nicht gefunden",
        close: "Schließen",
        pageTitleSuffix: "— Projektdetails",
      },
      fr: {
        languageLabel: "Langue",
        back: "Retour",
        crumbPrefix: "Projets / ",
        notFoundTitle: "Projet introuvable",
        notFoundDesc: "Les détails du projet n'ont pas pu être chargés. Veuillez rouvrir un projet depuis la page d'accueil.",
        goHome: "Retour à l'accueil",
        overviewTitle: "Résumé",
        overviewSub: "Cadre de recherche, portée et objectif.",
        highlightsTitle: "Contributions",
        highlightsSub: "Responsabilités techniques directes et résultats mesurables.",
        imgMissing: "Image introuvable",
        close: "Fermer",
        pageTitleSuffix: "— Détails du projet",
      },
      nl: {
        languageLabel: "Taal",
        back: "Terug",
        crumbPrefix: "Projecten / ",
        notFoundTitle: "Project niet gevonden",
        notFoundDesc: "Projectdetails konden niet worden geladen. Open het project opnieuw vanaf de homepagina.",
        goHome: "Naar home",
        overviewTitle: "Samenvatting",
        overviewSub: "Onderzoekskader, scope en doel.",
        highlightsTitle: "Bijdragen",
        highlightsSub: "Directe technische verantwoordelijkheden en meetbare resultaten.",
        imgMissing: "Afbeelding niet gevonden",
        close: "Sluiten",
        pageTitleSuffix: "— Projectdetails",
      },
      da: {
        languageLabel: "Sprog",
        back: "Tilbage",
        crumbPrefix: "Projekter / ",
        notFoundTitle: "Projekt ikke fundet",
        notFoundDesc: "Projektdetaljer kunne ikke indlæses. Åbn projektet igen fra forsiden.",
        goHome: "Gå til forsiden",
        overviewTitle: "Resumé",
        overviewSub: "Forskningsramme, omfang og mål.",
        highlightsTitle: "Bidrag",
        highlightsSub: "Direkte teknisk ansvar og målbare resultater.",
        imgMissing: "Billede ikke fundet",
        close: "Luk",
        pageTitleSuffix: "— Projektdetaljer",
      },
      sv: {
        languageLabel: "Språk",
        back: "Tillbaka",
        crumbPrefix: "Projekt / ",
        notFoundTitle: "Projektet hittades inte",
        notFoundDesc: "Projektinformationen kunde inte laddas. Öppna projektet igen från startsidan.",
        goHome: "Till startsidan",
        overviewTitle: "Sammanfattning",
        overviewSub: "Forskningsram, omfattning och mål.",
        highlightsTitle: "Bidrag",
        highlightsSub: "Direkta tekniska ansvar och mätbara resultat.",
        imgMissing: "Bild hittades inte",
        close: "Stäng",
        pageTitleSuffix: "— Projektdetaljer",
      },
      fi: {
        languageLabel: "Kieli",
        back: "Takaisin",
        crumbPrefix: "Projektit / ",
        notFoundTitle: "Projektia ei löytynyt",
        notFoundDesc: "Projektin tietoja ei voitu ladata. Avaa projekti uudelleen etusivulta.",
        goHome: "Etusivulle",
        overviewTitle: "Yhteenveto",
        overviewSub: "Tutkimuskehys, laajuus ja tavoite.",
        highlightsTitle: "Panokset",
        highlightsSub: "Suorat tekniset vastuut ja mitattavat tulokset.",
        imgMissing: "Kuvaa ei löytynyt",
        close: "Sulje",
        pageTitleSuffix: "— Projektin tiedot",
      }
    };

    function applyLang(lang){
      const T = uiCopy(lang);
      document.documentElement.lang = lang;
      languageSelect.value = lang;
      langLabel.textContent = T.languageLabel;

      document.getElementById("backBtnText").textContent = T.back;
      document.getElementById("crumbPrefix").textContent = T.crumbPrefix;

      document.getElementById("lightboxClose").setAttribute("aria-label", T.close);
      document.getElementById("lightboxImg").alt = (lang === "tr" ? "Proje görseli" : "Project image");
    }

    languageSelect.addEventListener("change", (event) => setLang(event.target.value));

    // ============ PROJE VERİLERİ ============
    // Görseller: images/<prefix><n>.png
    const PROJECTS = window.PORTFOLIO_CURRENT.projects;
    // ============ GERİ UYUMLULUK / ÖNCELİK ============
    function resolveProject(){
      const requested=new URLSearchParams(location.search).get("project");
      if(requested) return PROJECTS[requested] || null;
      const id = localStorage.getItem("currentProjectId");
      if(id && PROJECTS[id]) return PROJECTS[id];

      const raw = localStorage.getItem("currentProject");
      if(raw){
        try{
          const obj = JSON.parse(raw);
          if(obj && obj.title && obj.company){
            return normalizeLegacy(obj);
          }
        }catch(e){}
      }
      return null;
    }

    function normalizeLegacy(legacy){
      const id = legacy.imagePrefix || "project";
      const iconMap = {
        chefinpocket:"🍳", beme:"🧬", polieco:"🏛️", baykar:"🎯", bmc:"💬", intertech:"💰", arastirma:"🗣️",
        influencer:"📊", echospace:"🥽", bluesky:"🦋", music:"🎵", tbmm:"🕸️", sneakpeek:"🛍️"
      };

      return {
        id,
        icon: iconMap[id] || "✨",
        title: { tr: legacy.title || "Proje", en: legacy.title || "Project" },
        company: { tr: legacy.company || "—", en: legacy.company || "—" },
        period: legacy.period || "—",
        location: legacy.location || "—",
        description: { tr: legacy.description || "", en: legacy.description || "" },
        tech: legacy.tech || [],
        overview: {
          title: { tr: "Özet", en: "Summary" },
          text: { tr: legacy.description || "", en: legacy.description || "" }
        },
        responsibilities: {
          tr: legacy.responsibilities || [],
          en: legacy.responsibilities || []
        },
        kpis: (legacy.kpis || []).map(k => ({
          label: { tr: k.label, en: k.label },
          value: k.value
        })),
        images: (legacy.images || []).map(x => ({
          title: { tr: x.title, en: x.title },
          desc: { tr: x.desc, en: x.desc }
        }))
      };
    }

    // ============ UI ============
    const baseProject = resolveProject();

    const titleEl = document.getElementById("project-title");
    const companyEl = document.getElementById("company");
    const descEl = document.getElementById("description");
    const techEl = document.getElementById("tech-stack");
    const contentEl = document.getElementById("project-content");

    const crumbTitle = document.getElementById("crumbTitle");
    const periodChip = document.getElementById("periodChip");
    const locChip = document.getElementById("locChip");

    // Lightbox
    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightboxImg");
    const lightboxClose = document.getElementById("lightboxClose");

    function openLightbox(src, alt){
      lightboxImg.src = src;
      lightboxImg.alt = alt || (getLang()==="tr" ? "Proje görseli" : "Project image");
      lightbox.classList.add("active");
      lightbox.setAttribute("aria-hidden","false");
    }
    function closeLightbox(){
      lightbox.classList.remove("active");
      lightbox.setAttribute("aria-hidden","true");
      lightboxImg.src = "";
    }
    lightbox.addEventListener("click", (e) => {
      if(e.target === lightbox) closeLightbox();
    });
    lightboxClose.addEventListener("click", closeLightbox);
    document.addEventListener("keydown", (e) => {
      if(e.key === "Escape") closeLightbox();
    });

    function escapeHtml(str){
      return String(str ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function pick(obj){
      const lang = getLang();
      if(obj && typeof obj === "object" && (obj.tr || obj.en)){
        if(lang === "tr") return obj.tr || obj.en || "";
        return obj[lang] || obj.en || obj.tr || "";
      }
      return obj ?? "";
    }

    function imagePath(prefix, idx){
      return `images/${prefix}${idx}.png`;
    }

    function createTechTag(t){
      const div = document.createElement("div");
      div.className = "tech-tag";
      div.textContent = t;
      return div;
    }

    function createBullet(text){
      const row = document.createElement("div");
      row.className = "bullet";
      row.innerHTML = `<div class="dot"></div><div>${escapeHtml(text)}</div>`;
      return row;
    }

    function createKpi(label, value){
      const box = document.createElement("div");
      box.className = "kpi";
      box.innerHTML = `<div class="label">${escapeHtml(label)}</div><div class="value">${escapeHtml(value)}</div>`;
      return box;
    }

    function pickArray(obj){
      const picked = pick(obj);
      if(Array.isArray(picked)) return picked;
      return picked ? [picked] : [];
    }

    function createFormulaCard(formula){
      const card = document.createElement("div");
      card.className = "formula-card";
      if(formula.compact) card.classList.add("formula-card--compact");

      const label = document.createElement("div");
      label.className = "formula-label";
      label.textContent = pick(formula.label);

      const tex = document.createElement("div");
      tex.className = "formula-tex";
      tex.textContent = formula.tex || formula.value || "";

      card.appendChild(label);
      card.appendChild(tex);
      return card;
    }

    function createDetailTable(table){
      const wrap = document.createElement("div");
      wrap.className = "table-wrap";

      const el = document.createElement("table");
      el.className = "detail-table";

      const thead = document.createElement("thead");
      const headerRow = document.createElement("tr");
      pickArray(table.columns).forEach(col => {
        const th = document.createElement("th");
        th.textContent = col;
        headerRow.appendChild(th);
      });
      thead.appendChild(headerRow);
      el.appendChild(thead);

      const tbody = document.createElement("tbody");
      (table.rows || []).forEach(row => {
        const tr = document.createElement("tr");
        row.forEach(cell => {
          const td = document.createElement("td");
          td.textContent = pick(cell);
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
      el.appendChild(tbody);
      wrap.appendChild(el);
      return wrap;
    }

    function createDetailSection(section){
      const el = document.createElement("section");
      el.className = "detail-section";

      const title = document.createElement("h2");
      title.textContent = pick(section.title);
      el.appendChild(title);

      const lead = pick(section.lead);
      if(lead){
        const leadEl = document.createElement("div");
        leadEl.className = "detail-lead";
        leadEl.textContent = lead;
        el.appendChild(leadEl);
      }

      const paragraphs = pickArray(section.paragraphs);
      if(paragraphs.length){
        const copy = document.createElement("div");
        copy.className = "detail-copy";
        paragraphs.forEach(text => {
          const p = document.createElement("p");
          p.textContent = text;
          copy.appendChild(p);
        });
        el.appendChild(copy);
      }

      const bullets = pickArray(section.bullets);
      if(bullets.length){
        const bulletsWrap = document.createElement("div");
        bulletsWrap.className = "detail-bullets";
        bullets.forEach(text => bulletsWrap.appendChild(createBullet(text)));
        el.appendChild(bulletsWrap);
      }

      if(section.formulas && section.formulas.length){
        const formulas = document.createElement("div");
        formulas.className = "formula-grid";
        section.formulas.forEach(f => formulas.appendChild(createFormulaCard(f)));
        el.appendChild(formulas);
      }

      if(section.table){
        el.appendChild(createDetailTable(section.table));
      }

      return el;
    }

    function localizedProjectFor(base, lang){
      if(!base) return null;
      if(!window.PROJECT_I18N || !window.PROJECT_I18N[lang]) return base;
      return window.PROJECT_I18N[lang][base.id] || base;
    }

    function render(){
      const lang = getLang();
      const T = uiCopy(lang);
      const project = localizedProjectFor(baseProject, lang);

      if(!project){
        document.body.innerHTML = `
          <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;text-align:center;padding:2rem;">
            <h1 style="font-family:Merriweather,Georgia,'Times New Roman',serif;font-size:2rem;margin-bottom:1rem;color:#1f2328;">
              ${escapeHtml(T.notFoundTitle)}
            </h1>
            <p style="color:#5f6670;max-width:700px;line-height:1.7;">
              ${escapeHtml(T.notFoundDesc)}
            </p>
            <a href="index.html" class="back-btn" style="margin-top:1.8rem;">${escapeHtml(T.goHome)}</a>
          </div>
        `;
        return;
      }

      const title = pick(project.title);
      const company = pick(project.company);
      const description = pick(project.description);
      const overviewTitle = pick(project.overview?.title) || T.overviewTitle;
      const overviewText = pick(project.overview?.text) || description;

      document.title = `${title} ${T.pageTitleSuffix}`;

      titleEl.textContent = title;
      companyEl.textContent = company;
      descEl.textContent = description;

      crumbTitle.textContent = title;
      periodChip.textContent = pick(project.period) || "—";
      locChip.textContent = pick(project.location) || "—";

      // Tech tags
      techEl.innerHTML = "";
      (project.tech || []).forEach(t => techEl.appendChild(createTechTag(t)));

      // Main content
      contentEl.innerHTML = "";

      // Row: Overview + Highlights
      const row = document.createElement("div");
      row.className = "cards-row";

      const overviewCard = document.createElement("div");
      overviewCard.className = "card overview-card";
      overviewCard.innerHTML = `
        <h2>${escapeHtml(overviewTitle)}</h2>
        <div class="sublead">${escapeHtml(T.overviewSub)}</div>
        <p>${escapeHtml(overviewText)}</p>
      `;

      const highlightCard = document.createElement("div");
      highlightCard.className = "card";
      highlightCard.innerHTML = `
        <h2>${escapeHtml(T.highlightsTitle)}</h2>
        <div class="sublead">${escapeHtml(T.highlightsSub)}</div>
      `;

      const resp = pickArray(project.responsibilities);
      const kpis = (project.kpis || []);

      const bulletsWrap = document.createElement("div");
      bulletsWrap.className = "bullets";
      resp.forEach(r => bulletsWrap.appendChild(createBullet(r)));
      if(resp.length === 0){
        bulletsWrap.appendChild(createBullet(lang==="tr"
          ? "Detaylar yakında genişletilecek (CV bazlı içerik güncelleniyor)."
          : "Details will be expanded soon (CV-aligned content is being updated)."
        ));
      }

      const kpiGrid = document.createElement("div");
      kpiGrid.className = "kpi-grid";
      kpis.forEach(k => kpiGrid.appendChild(createKpi(pick(k.label), k.value)));

      highlightCard.appendChild(bulletsWrap);
      if(kpis.length) highlightCard.appendChild(kpiGrid);

      row.appendChild(overviewCard);
      row.appendChild(highlightCard);
      contentEl.appendChild(row);

      // Research-style detail sections
      (project.details || []).forEach(section => {
        contentEl.appendChild(createDetailSection(section));
      });

      // Image sections
      const imgs = project.images || [];
      imgs.forEach((img, index) => {
        const section = document.createElement("div");
        section.className = "image-section";

        const src = img.src || imagePath(project.id, index + 1);
        const imgTitle = pick(img.title) || (lang==="tr" ? "Detay" : "Detail");
        const imgDesc = pick(img.desc) || "";
        const alt = `${title} - ${imgTitle}`;

        section.innerHTML = `
          <img src="${src}" alt="${escapeHtml(alt)}" class="project-image" data-src="${src}"
               onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
          <div class="image-placeholder" style="display:none;">
            <div style="filter: drop-shadow(0 10px 20px rgba(0,0,0,.18));">${escapeHtml(project.icon || "📌")}</div>
            <div class="placeholder-sub">${escapeHtml(T.imgMissing)}</div>
          </div>
          <h3>${escapeHtml(imgTitle)}</h3>
          <p>${escapeHtml(imgDesc)}</p>
        `;

        const imageEl = section.querySelector(".project-image");
        if(imageEl){
          imageEl.addEventListener("click", () => {
            if(getComputedStyle(imageEl).display !== "none"){
              openLightbox(imageEl.getAttribute("data-src"), imageEl.alt);
            }
          });
        }

        contentEl.appendChild(section);
      });

      if(window.MathJax && window.MathJax.typesetPromise){
        window.MathJax.typesetPromise([contentEl]).catch(() => {});
      }
    }

    // İlk yükleme
    applyLang(getLang());
    render();
  </script>
<script src="concise-project.js"></script>
</body>
</html>
